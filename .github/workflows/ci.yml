name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        # mise ставит инструменты по mise.toml и кэширует их между запусками
      - run: npm ci
      - run: mise run check
